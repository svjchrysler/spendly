server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip for text assets
  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location ~* ^/workbox-.*\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  # Bundles y fuentes con hash en el nombre — inmutables por un año.
  # 404 en vez de fallback: un asset que falta no debe devolver el index.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Shell del SPA + iconos sin hash: revalidar siempre para no servir una
  # versión vieja tras el deploy.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
